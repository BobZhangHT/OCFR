name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Build native backend
        run: python -c "import methods; print(methods.build_native())"
      - name: Run tests
        run: python -m pytest
      - name: Check command-line interfaces
        run: |
          python simulation.py --help
          python analysis.py --help
          python real_data.py --help
