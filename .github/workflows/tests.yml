name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Build distribution archives without native compilation
        run: |
          python -m pip install build
          python -m build --outdir dist
      - name: Build native backend
        run: python -c "import methods; print(methods.build_native(force=True)); print(methods.assert_backend_parity())"
      - name: Run tests
        run: python -m pytest
      - name: Check command-line interfaces
        run: |
          python simulation.py --help
          ocfr-simulate --help
          ocfr-analyze --help
          ocfr-real-data --help
