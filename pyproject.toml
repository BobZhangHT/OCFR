[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ocfr-core"
version = "0.1.0"
description = "Online change detection for delay-adjusted epidemic fatality risk"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<22",
  "pillow>=10,<13",
  "scipy>=1.11,<2",
]

[project.urls]
Repository = "https://github.com/BobZhangHT/OCFR"

[project.scripts]
ocfr-simulate = "simulation:main"
ocfr-analyze = "analysis:main"
ocfr-real-data = "real_data:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["config", "methods", "simulation", "analysis", "real_data"]

# Install native sources alongside the flat Python modules.
[tool.setuptools.packages.find]
where = ["."]
include = ["csrc"]
namespaces = true

[tool.setuptools.package-data]
csrc = ["*.c"]
